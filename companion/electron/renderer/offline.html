<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Sem conexão · Lume</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080d17; color: #e8eefb; font-family: "Segoe UI", system-ui, sans-serif; }
    main { max-width: 420px; padding: 2rem; text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 1.2rem; border-radius: 18px; background: linear-gradient(135deg, #5ea8ff, #4de0b8); opacity: .9; }
    h1 { font-size: 1.35rem; margin: 0 0 .6rem; }
    p { color: #9fb0cc; line-height: 1.5; margin: 0 0 1.4rem; }
    button { font: inherit; font-weight: 600; padding: .7rem 1.2rem; border-radius: 10px; border: 1px solid #2a3a57; background: #111c30; color: #e8eefb; cursor: pointer; }
    button:hover { border-color: #5ea8ff; color: #5ea8ff; }
    .actions { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
    small { display: block; margin-top: 1.4rem; color: #61718c; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Não consegui falar com o Lume.</h1>
    <p>Verifique a conexão. A presença local continua pausada até o Lume voltar; nada foi perdido.</p>
    <div class="actions">
      <button id="retry" type="button">Tentar de novo</button>
      <button id="browser" type="button">Abrir no navegador</button>
    </div>
    <small id="detail"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const target = params.get('url') || 'https://lume.lume-prototype.workers.dev';
    const reason = params.get('reason');
    const code = params.get('code');
    if (reason || code) document.getElementById('detail').textContent = [reason, code].filter(Boolean).join(' · ');
    document.getElementById('retry').addEventListener('click', () => { location.replace(target); });
    document.getElementById('browser').addEventListener('click', () => { window.open(target, '_blank'); });
  </script>
</body>
</html>
