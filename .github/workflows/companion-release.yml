name: Companion release

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já existente, no formato companion-v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Instalar dependências do Companion
        run: npm ci

      - name: Conferir se a tag combina com a versão
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "companion-v$version") {
            throw "A tag $tag não corresponde a companion-v$version. Atualize companion/package.json ou use a tag certa."
          }
          Write-Host "Publicando $tag (Windows)"

      - name: Gerar instalador Windows
        run: npm run dist
        env:
          # Sem certificado, gera instalador não assinado (o Windows mostra aviso).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Validar artefatos Windows
        shell: pwsh
        run: |
          $required = @('Lume-setup.exe', 'Lume-setup.exe.blockmap', 'latest.yml')
          foreach ($name in $required) {
            if (-not (Test-Path "release/$name")) { throw "Artefato ausente em companion/release: $name" }
          }

      - name: Guardar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: lume-companion-windows
          path: |
            companion/release/Lume-setup.exe
            companion/release/Lume-setup.exe.blockmap
            companion/release/latest.yml
          retention-days: 14

  build-linux:
    name: Pacotes Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Instalar dependências do Companion
        run: npm ci

      - name: Conferir se a tag combina com a versão
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "companion-v$VERSION" ]; then
            echo "A tag $TAG não corresponde a companion-v$VERSION. Atualize companion/package.json ou use a tag certa." >&2
            exit 1
          fi
          echo "Publicando $TAG (Linux)"

      - name: Gerar pacotes Linux (.AppImage e .deb)
        run: npm run dist:linux

      - name: Validar artefatos Linux
        shell: bash
        run: |
          for name in Lume.AppImage Lume.deb latest-linux.yml; do
            if [ ! -f "release/$name" ]; then
              echo "Artefato ausente em companion/release: $name" >&2
              exit 1
            fi
          done

      - name: Guardar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: lume-companion-linux
          path: |
            companion/release/Lume.AppImage
            companion/release/Lume.deb
            companion/release/latest-linux.yml
          retention-days: 14

  publish:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lume-companion-windows
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: lume-companion-linux
          path: release-assets

      - name: Publicar release com instaladores Windows e Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Lume $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" release-assets/* --clobber
          echo "Release $TAG publicada."
